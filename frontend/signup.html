<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sign Up - Smart Medicine
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page">


<div class="auth-card">


    <a
        href="index.html"
        class="back-link"
    >
        ← Back to Home
    </a>


    <div class="auth-icon">
        🛡️
    </div>


    <h1>
        Create Account
    </h1>


    <p>
        Create your Smart Medicine account.
    </p>


    <form id="signupForm">

        <label>
            Name
        </label>

        <input
            id="signupName"
            type="text"
            required
            placeholder="Your name"
        >


        <label>
            Email
        </label>

        <input
            id="signupEmail"
            type="email"
            required
            placeholder="you@example.com"
        >


        <label>
            Password
        </label>

        <input
            id="signupPassword"
            type="password"
            minlength="6"
            required
            placeholder="Minimum 6 characters"
        >


        <button
            type="submit"
            class="primary-btn"
        >
            Create Account
        </button>

    </form>


    <p
        id="signupMessage"
        class="form-message"
    ></p>


    <p class="auth-switch">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>


</div>


<script src="auth.js"></script>

</body>

</html>
